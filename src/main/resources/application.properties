# Server Configuration
server.port=${SERVER_PORT:8080}
server.tomcat.connection-timeout=120000

# MySQL Database Configuration (Sensitive credentials loaded from .env)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:fileupload_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:5646}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# Hibernate / JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Multipart Upload Limits (Per chunk: up to 50MB per chunk request)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:50MB}
spring.servlet.multipart.file-size-threshold=2MB

# Default chunk size in bytes (5 MB = 5,242,880)
app.upload.default-chunk-size=${DEFAULT_CHUNK_SIZE:5242880}

# AWS S3 Configuration (Direct Browser Upload)
aws.s3.region=${AWS_REGION:us-east-1}
aws.s3.bucket=${AWS_S3_BUCKET:fileupload-bucket}
aws.s3.access-key-id=${AWS_ACCESS_KEY_ID:test-access-key}
aws.s3.secret-access-key=${AWS_SECRET_ACCESS_KEY:test-secret-key}
aws.s3.endpoint=${AWS_S3_ENDPOINT:}
